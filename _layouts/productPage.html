---
layout: default
---

<style>
  .product-page-shell {
    max-width: 1246px;
    margin: 0 auto;
  }
</style>
<style>
  .wp-hero {
    text-align: center;
    padding: 40px 20px 30px;
  }

  .wp-hero img {
    width: 96px;
    margin-bottom: 16px;
  }

  .wp-hero h1 {
    font-size: 2em;
    margin-bottom: 8px;
  }

  .wp-hero .tagline {
    font-size: 1.2em;
    color: #555;
    margin-bottom: 24px;
  }

  .wp-cta-btn {
    display: inline-block;
    background: #0078d4;
    color: #fff !important;
    padding: 12px 28px;
    border-radius: 4px;
    font-weight: bold;
    text-decoration: none;
    font-size: 1.05em;
  }

  .wp-cta-btn:hover {
    background: #005a9e;
  }

  .wp-social-proof {
    background: #f5f5f5;
    text-align: center;
    padding: 14px 20px;
    color: #444;
    font-size: 0.95em;
    margin: 30px 0;
  }

  /* Benefits */
  .wp-benefits {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
    margin: 30px 0;
  }

  .wp-benefit-card {
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    min-height: 190px;
    height: 100%;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 20px 18px;
    background: #fafafa;
  }

  .wp-benefit-card h3 {
    margin: 0 0 10px;
    font-size: 1em;
    color: #0078d4;
  }

  .wp-benefit-card p {
    margin: 0;
  }

  /* Features */
  .wp-features-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    margin: 30px 0;
  }

<main class="page-content" aria-label="Content">
  <div class="product-page-shell">

<div class="wp-hero">
  <img src="{{ site.baseurl }}/img/wikipro-logo.png" alt="Wiki PRO logo" />
  <span style="font-size:82px;font-weight:600;vertical-align: bottom;"> Wiki PRO</span>
  <div class="tagline">The wiki experience Everyone has been waiting for</div>
  <a class="wp-cta-btn" href="https://marketplace.visualstudio.com/items?itemName=mskold.mskold-WikiPRO">Install Wiki PRO for free now →</a>
</div>

<div class="wp-social-proof">
  Built by MSkold AB · Certified Top Publisher on the Azure DevOps Marketplace &nbsp;·&nbsp;
  Trusted by 30,000+ organizations &nbsp;·&nbsp;
  Freemium — core features are free
</div>

    <div class="wp-three-col">
  <div class="wp-col-nav">
    <div class="wp-nav-links">
      <a href="/wiki-pro/">Overview</a>
      <a href="/wiki-pro/features/">Features Higlight</a>
      <a href="/wiki-pro/pricing/">Pricing &amp; licensing</a>  
      <a href="/support/WikiPro/">Support &amp; docs</a>
    </div>
  </div>

  <div class="wp-col-content">
      <div id="article-toc" class="wp-col-toc" style="margin-top:64px;">    
        {{ content | toc_only }}
      </div>
    {{ content }}
  </div>


</div>
    
  </div>
</main>
